<!doctype html>
<html lang="pt-PT">

<title>Story modelo — Destaca</title>
<style>body{margin:0}</style>

<body>
<!-- Story 1080x1920. Zonas seguras: nada importante nos 260px de cima nem nos 300px de baixo (UI do Instagram). -->
<div style="width:1080px;height:1920px;box-sizing:border-box;background:#050F16;color:#FFF4EA;font-family:Inter,sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:300px 96px 340px">

  <div style="display:flex;flex-direction:column;gap:56px;position:relative">
    <span style="font-family:Archivo,sans-serif;font-weight:800;font-size:34px;letter-spacing:0.16em;color:#FF7A1F">DICA DO DIA</span>

    <span style="font-family:Archivo,sans-serif;font-weight:800;font-size:36px;letter-spacing:-0.02em">destaca</span>
  </div>
</div>
